name: Lint and Delete Reaction

on:
  push:
    branches:
      - main

jobs:
  lint-and-delete-reaction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Run linter and delete reaction
        uses: ./  # Usa o código do repositório atual
        with:
          github_token: ${{ secrets.CLASSIC_GITHUB_TOKEN }}